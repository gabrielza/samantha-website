<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Samantha Black — Property Practitioner, Just Property Cape Town. Luxury rentals, residential sales, and expert guidance across the Atlantic Seaboard, City Centre, Parklands, and beyond." />
    <meta name="theme-color" content="#164E63" />
    <title>Samantha Black | Property Practitioner — Just Property Cape Town</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <!-- Hidden Netlify Forms for SPA detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
    <form name="property-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="property" />
      <textarea name="message"></textarea>
    </form>
    <form name="guide-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="guide" />
    </form>
    <form name="valuation" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="contact-preference" />
      <input type="text" name="street-address" />
      <input type="text" name="suburb" />
      <input type="text" name="city" />
      <input type="text" name="province" />
      <input type="text" name="postal-code" />
      <input type="text" name="complex-name" />
      <input type="text" name="property-type" />
      <input type="text" name="condition" />
      <input type="text" name="bedrooms" />
      <input type="text" name="bathrooms" />
      <input type="text" name="parking" />
      <input type="number" name="floor-size" />
      <input type="number" name="erf-size" />
      <input type="number" name="year-built" />
      <input type="text" name="reason" />
      <textarea name="renovations"></textarea>
      <textarea name="notes"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
