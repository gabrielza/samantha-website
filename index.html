<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Samantha Black — Independent Cape Town Property Specialist. Luxury rentals, residential sales, and expert guidance across the Atlantic Seaboard, City Centre, Parklands, and beyond." />
    <meta name="theme-color" content="#1B2A4A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Samantha Black | Cape Town Property Specialist</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <!-- Hidden Netlify Forms for SPA detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
    <form name="property-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="property" />
      <textarea name="message"></textarea>
    </form>
    <form name="guide-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="guide" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
